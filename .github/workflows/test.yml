name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No Python setup and no install step: the self-checks are bash, and the
      # only tools they need (git, jq, python3 for format-open-prs.py) are on
      # the runner image. config/site.env is gitignored, so each test
      # synthesises its own — nothing here dials a real endpoint.
      - name: Run self-checks
        run: make test-unit
