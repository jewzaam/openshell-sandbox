# Generated By: Claude Code (Claude Opus 5)
name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships shellcheck, but the runner image's contents are not
      # a contract — install only when it is missing.
      - name: Ensure shellcheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y shellcheck
          }

      - name: Lint
        run: make test-lint
