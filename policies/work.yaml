# OpenShell sandbox policy: work profile
# Vertex AI (Google Cloud) + Jira
#
# ${OTEL_HOST}, ${OTEL_PORT}, ${PROMETHEUS_HOST}, ${PROMETHEUS_PORT},
# ${LOKI_HOST}, and ${LOKI_PORT} are substituted from config/site.env by
# render_policy() in scripts/sandbox.sh. This file is a template — do not
# pass it to `openshell` directly.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc
    - /sys
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /home

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  openai_api:
    name: openai-api
    # Identical to the codex profile's block — see policies/codex.yaml for why
    # all three hosts are required. Work carries it *in addition to*
    # vertex-ai-inference rather than instead of it: a work sandbox runs both
    # agents, unlike the codex profile where openai-api replaces anthropic-api.
    endpoints:
      - host: chatgpt.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: auth.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: "/**" }

  vertex_ai:
    name: vertex-ai-inference
    endpoints:
      - host: "**.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: "/**" }

  jira_api:
    name: jira-rw
    endpoints:
      - host: redhat.atlassian.net
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: api.atlassian.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: auth.atlassian.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: "/**" }

  npm:
    name: npm-readonly
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: "/**" }

  otel:
    name: otel-collector
    endpoints:
      - host: ${OTEL_HOST}
        port: ${OTEL_PORT}
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: "/**" }

  prometheus:
    name: prometheus-read
    endpoints:
      - host: ${PROMETHEUS_HOST}
        port: ${PROMETHEUS_PORT}
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: "/**" }

  loki:
    name: loki-read
    endpoints:
      - host: ${LOKI_HOST}
        port: ${LOKI_PORT}
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: "/**" }

  debian:
    name: debian-readonly
    endpoints:
      - host: deb.debian.org
        port: 80
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: deb.debian.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: "/**" }

  pypi:
    name: pypi-readonly
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: "/**" }
